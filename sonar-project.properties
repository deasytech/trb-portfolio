sonar.sources=app,resources/views,routes,database
sonar.tests=tests

# Livewire single-file components must be written as a bare `new class extends Component {}`,
# which php:S1848 misreads as a useless instantiation.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1848
sonar.issue.ignore.multicriteria.e1.resourceKey=resources/views/**/*.blade.php
